name: Review SANA favicon
on:
  push:
    branches: [feature/sana-favicon]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NITRO_PRESET: node-server
      SANA_BASE_PATH: /SanaDeviceLanding/
      VITE_STATIC_SITE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format favicon metadata
        run: |
          pnpm exec prettier --write src/routes/__root.tsx public/site.webmanifest
          node -e 'const fs=require("node:fs");for(const p of ["src/routes/__root.tsx","public/site.webmanifest"])console.log("SANA_FORMAT_FILE "+p+" "+fs.readFileSync(p).toString("base64"))'
      - run: pnpm exec eslint --max-warnings 0 src/routes/__root.tsx
      - run: pnpm build
      - run: pnpm typecheck
      - run: node scripts/export-github-pages.mjs
      - name: Check transparent icons and all exported head links
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          for name,size in [("favicon.png",64),("apple-touch-icon.png",180),("icon-192.png",192),("icon-512.png",512)]:
              im=Image.open("public/"+name).convert("RGBA")
              assert im.size==(size,size)
              assert all(im.getpixel(p)[3]==0 for p in [(0,0),(size-1,0),(0,size-1),(size-1,size-1)])
              bounds=im.getchannel("A").point(lambda a:255 if a>=128 else 0).getbbox()
              assert bounds[2]-bounds[0]>=size*.85
              print("ICON PASS",name,size,bounds)
          ico=Image.open("public/favicon.ico")
          assert {(16,16),(32,32),(48,48)}.issubset(ico.ico.sizes())
          for html in Path("artifacts/github-pages").rglob("index.html"):
              text=html.read_text()
              assert "/SanaDeviceLanding/favicon.ico?v=red-s-20261024" in text, str(html)
              assert "/SanaDeviceLanding/favicon.png?v=red-s-20261024" in text, str(html)
              print("ICON HEAD PASS",html)
          manifest=json.loads(Path("public/site.webmanifest").read_text())
          assert all("v=red-s-20261024" in icon["src"] for icon in manifest["icons"])
          PY
