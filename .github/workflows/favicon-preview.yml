name: Inspect SANA favicon
on:
  push:
    branches: [feature/sana-favicon]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Inspect current icon
        run: |
          python - <<'PY'
          import base64
          from PIL import Image
          from io import BytesIO
          im=Image.open("public/favicon.png").convert("RGBA")
          print("FAVICON_CURRENT_INFO", im.size, im.getpixel((0,0)), im.getbbox())
          out=BytesIO()
          im.resize((256,256)).save(out,format="PNG")
          print("FAVICON_CURRENT_PREVIEW "+base64.b64encode(out.getvalue()).decode())
          PY
