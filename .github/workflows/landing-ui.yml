name: Landing UI review

on:
  push:
    branches: [feature/sana-medical-landing]
    paths-ignore: ["docs/**"]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NITRO_PRESET: node-server
      SANA_QA_URL: http://127.0.0.1:4173
      SANA_BASELINE_URL: http://127.0.0.1:4174
      SANA_BASELINE_SHA: f56c922c5792988143e50ccefcc036d894eccf5a
      SANA_LEAD_WEBHOOK_URL: http://127.0.0.1:4180/webhook
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set isolated tooling and baseline directories
        run: |
          echo "SANA_QA_DIR=$RUNNER_TEMP/sana-ui-qa" >> "$GITHUB_ENV"
          echo "SANA_BEFORE_DIR=$RUNNER_TEMP/sana-before" >> "$GITHUB_ENV"
          mkdir -p artifacts/ui-review
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve product content, consultation and attribution
        run: |
          git diff --exit-code "$SANA_BASELINE_SHA" -- src/lib/attribution.ts src/components/landing/products.ts
          node scripts/check-lead-contract.mjs
      - name: Full lint report
        id: lint
        continue-on-error: true
        run: pnpm lint --format json --output-file artifacts/ui-review/after-lint.json
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$SANA_QA_DIR" --no-save playwright@1.56.1
          "$SANA_QA_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build the immutable before version
        run: |
          git worktree add --detach "$SANA_BEFORE_DIR" "$SANA_BASELINE_SHA"
          pnpm --dir "$SANA_BEFORE_DIR" install --frozen-lockfile
          pnpm --dir "$SANA_BEFORE_DIR" build
          set +e
          pnpm --dir "$SANA_BEFORE_DIR" lint --format json --output-file "$GITHUB_WORKSPACE/artifacts/ui-review/before-lint.json"
          SANA_BEFORE_LINT_STATUS=$?
          set -e
          printf '%s\n' "$SANA_BEFORE_LINT_STATUS" > artifacts/ui-review/before-lint-status.txt
      - name: Check lint against the immutable baseline
        run: node scripts/check-lint-regressions.mjs
      - name: Measure before and after and review all routes
        env:
          HOST: 0.0.0.0
          SANA_TEST_URL: http://127.0.0.1:4173
        run: |
          PORT=4174 node "$SANA_BEFORE_DIR/.output/server/index.mjs" > artifacts/ui-review/before-server.log 2>&1 &
          SANA_BEFORE_PID=$!
          PORT=4173 node .output/server/index.mjs > artifacts/ui-review/after-server.log 2>&1 &
          SANA_AFTER_PID=$!
          trap 'kill "$SANA_BEFORE_PID" "$SANA_AFTER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent "$SANA_BASELINE_URL" > /dev/null && curl --fail --silent "$SANA_QA_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$SANA_BASELINE_URL" > /dev/null
          curl --fail --silent "$SANA_QA_URL" > /dev/null
          SANA_METRICS_PHASE=before node scripts/measure-home-baseline.mjs
          pnpm test:routes
          node --test tests/consultation-api.test.mjs
          node scripts/ui-review.mjs
          SANA_METRICS_PHASE=after node scripts/measure-home-baseline.mjs
      - name: Verify the deployed preview
        run: node scripts/check-live-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-ui-review
          path: artifacts/ui-review
          retention-days: 7
          if-no-files-found: ignore
  format-review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NITRO_PRESET: node-server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        continue-on-error: true
      - run: node scripts/print-format-review.mjs
