name: Read official Form SOAP PDF
on:
  push:
    branches: [research/payamgostar-docs-access]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install PyMuPDF==1.26.5
      - run: python scripts/research-payamgostar-docs.py
