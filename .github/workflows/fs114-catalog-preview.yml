name: Verify published FS-114 catalog
on:
  push:
    branches: [feature/sana-fs114-catalog]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Download public catalog and verify its exact size and SHA-256
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,time
          url="https://cbc.ortanes.com/product-assets/wondfo/catalogs/fs-114-catalog.pdf?catalog_v=compressed-20261025"
          expected_size=2061137
          expected_sha="bc1aacc4f775e9b12a472c532ca7949ebb0915080bbc43462a706795cce699ff"
          for attempt in range(12):
              request=urllib.request.Request(url,headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(request,timeout=25) as response:
                  data=response.read()
                  content_type=response.headers.get("content-type")
                  status=response.status
              sha=hashlib.sha256(data).hexdigest()
              if len(data)==expected_size and sha==expected_sha:
                  assert status==200 and data.startswith(b"%PDF-") and "pdf" in content_type
                  print("PUBLISHED_PDF_PASS "+json.dumps({"url":url,"status":status,"bytes":len(data),"sha256":sha,"contentType":content_type}))
                  break
              print("Waiting for Pages publication",attempt+1,flush=True)
              time.sleep(8)
          else:raise AssertionError("Published PDF does not match the verified compressed catalog")
          PY
