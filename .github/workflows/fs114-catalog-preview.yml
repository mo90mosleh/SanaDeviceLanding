name: Optimize FS-114 catalog
on:
  push:
    branches: [feature/sana-fs114-catalog]
permissions:
  contents: write
jobs:
  compress:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ghostscript qpdf
          python -m pip install PyMuPDF==1.26.5 Pillow==11.3.0
      - name: Compress and validate catalog; store the verified Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/optimize-fs114-catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fs114-catalog-compression
          path: artifacts/fs114-compression
          retention-days: 7
          if-no-files-found: ignore
